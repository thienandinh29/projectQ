# Grammar items for the English roadmap (specs/level-test): milestone tests, quick checks, practice.
# Written by the agent as DRAFT; the owner reviews each and changes `status` to `reviewed`. Draft items are served to
# the owner alone, labelled "Bản nháp"; other testers only ever see reviewed items.
# Each item practises one hidden node (`node`). Exactly one option is correct; every wrong option names the
# misconception it reveals. Options are shuffled when served. Only options with exactly one correct answer are used
# (for example "If I was you" is acceptable informally, so it is never offered as a wrong option).
course: english-ielts
