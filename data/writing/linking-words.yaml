# Linking words and phrases by function, for the Coherence and Cohesion measures (specs/writing). Authored.
addition: [also, moreover, furthermore, in addition, what is more, besides, as well as]
contrast: [however, although, though, even though, whereas, while, on the other hand, nevertheless, in contrast, despite, in spite of, yet]
cause_effect: [because, since, as a result, therefore, consequently, thus, due to, owing to, so that, hence]
example: [for example, for instance, such as, in particular, namely]
sequence: [firstly, first of all, secondly, finally, lastly, then, next, to begin with]
opinion: [in my opinion, i believe, i think, from my perspective, personally, in my view]
conclusion: [in conclusion, to sum up, overall, to conclude, in summary, all in all]
