# Core seed word list (specs/vocabulary): authored by the project, not copied from any source.
# status: draft until the owner has reviewed every entry (definition, examples, collocations, Vietnamese gloss).
# Levels are approximate. Practice items are built from this file; a typed answer is graded exactly, so list real
# spelling variants (colour/color) under `accepted`.
#
# Per word: `examples` (a sentence; `answer` is the part the learner types), `collocations` (a phrase and the
# `blank` word), `forms` (the learner sees `base` and types the form that fits the sentence).
slug: core-seed
title_vi: Từ vựng cốt lõi (bản mẫu tự soạn)
title_en: Core vocabulary (authored seed)
status: draft
words:
- lemma: important
  pos: adjective
  level: A2
  definition: having great value or a strong effect on something
  vi: quan trọng
  examples:
  - text: It is important to sleep well before an exam.
    answer: important
  forms:
  - base: important
    sentence: Teachers often stress the ___ of reading every day.
    answer: importance
- lemma: choose
  pos: verb
