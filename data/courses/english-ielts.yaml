# English pack: the grammar roadmap (specs/english-course). STARTER DRAFT for the owner to extend.
#
# Two layers (docs/v2/english-pack-proposal.vi.md):
#   - a MILESTONE (no `part_of`) is what the learner sees on the roadmap, e.g. "Conditionals: types 1 and 2";
#   - a HIDDEN NODE (`part_of: <milestone>`) is a smaller step under it, opened only when the milestone is not passed.
# The graph is shallow: milestones are ordered by CEFR level; add `prerequisites` only for obvious chains.
# Checked by code: prerequisites exist, no cycles, no prerequisite above the level of what needs it, a hidden node
# is not above its milestone's level, no hidden node under a hidden node.
# Check after every edit (from apps/api):
#   uv run python -m app.curriculum.check ../../data/courses/english-ielts.yaml
#
# Authored by the project (levels are approximate; EVP/EGP and CEFR descriptors are references only, nothing is
# copied). Owner's task: extend to the milestones A2-C1 need (modals, relative clauses, reported speech, gerunds and
# infinitives, countable/uncountable, linking words, word formation, subject-verb agreement, ...).
