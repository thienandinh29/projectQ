# Local P2 services: Postgres + pgvector and the bge-m3 embedding server.
services:
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: nodetrail-tei
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - tei-data:/data
    command:
      - --model-id
      - BAAI/bge-m3
      - --max-batch-tokens
      - "1024"
      - --max-client-batch-size
      - "32"
      - --max-concurrent-requests
      - "64"
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    container_name: nodetrail-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodetrail
    ports:
      - "54322:5432"
    volumes:
      - nodetrail-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodetrail"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tei-data:
  nodetrail-db:
