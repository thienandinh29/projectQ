name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nodetrail
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type check (warnings only)
        continue-on-error: true
        run: uv run mypy .
      - run: uv run pytest -q
      - name: Evaluation gates (placement accuracy vs baseline)
        run: uv run python -m app.evalkit.gates check ../../evals/baselines/placement-gate.json
      - name: Evaluation gate (level test on the English roadmap vs baseline)
        run: uv run python -m app.evalkit.english_gate check ../../evals/baselines/english-placement.json

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy nodetrail_runner
      - name: Build the sandbox image
        run: docker build -t nodetrail-sandbox:latest sandbox
      - name: Server tests and escape tests (hostile code in the real sandbox)
        env:
          REQUIRE_SANDBOX: "1"
        run: uv run pytest -q -rs
      - name: Build the runner image
        run: docker build -t nodetrail-runner:ci .

  code-selftest:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the sandbox image
        run: docker build -t nodetrail-sandbox:latest runner/sandbox
      - name: Start the runner
        working-directory: runner
        run: |
          uv sync --locked
          nohup uv run python -m nodetrail_runner.server > /tmp/runner.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/health && exit 0; sleep 1; done
          cat /tmp/runner.log; exit 1
      - name: Every code exercise tells right from wrong (in the real sandbox)
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run python -m app.graders.selftest ../../data/courses --runner-url http://127.0.0.1:8090

  # The whole stack from one command, checked end to end (specs/one-command-start).
  stack:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-only-api-key-0123456789
      RUNNER_TOKEN: ci-only-runner-token-0123456789
      # The browser tests' learner, allowed to see draft items (specs/web-english).
      DRAFT_ITEM_LEARNERS: 00000000-0000-4000-8000-0000000e2e01
      E2E_LEARNER_ID: 00000000-0000-4000-8000-0000000e2e01
    steps:
      - uses: actions/checkout@v4
      - name: Start everything with one command
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: End-to-end checks
        run: scripts/stack-smoke.sh
      - name: Create the browser tests' learner
        run: >-
          docker compose exec -T db psql -U postgres -d nodetrail -qc
          "insert into learners(id,display_name) values ('$E2E_LEARNER_ID','E2E') on conflict do nothing"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser tests (Playwright, phone size)
        working-directory: apps/web
        run: |
          npx pnpm@10.20.0 install --frozen-lockfile
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down --volumes

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx pnpm@10.20.0 install --frozen-lockfile
      - run: npx pnpm@10.20.0 lint
      - run: npx pnpm@10.20.0 typecheck
      - run: npx pnpm@10.20.0 test
