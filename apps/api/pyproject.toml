[project]
name = "nodetrail-api"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "en-core-web-sm",
    "errant>=3.0.2,<3.1",
    "fastapi>=0.156.8",
    "fsrs>=6.3.2",
    "google-auth>=2.62.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "spacy>=3.8,<3.9",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
# Optional `embed` extra; absent in CI, imported lazily in app/rag/embed.py.
module = ["sentence_transformers.*", "sentence_transformers"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ERRANT ships no type information; app/writing/grammar.py types what it uses (`Annotator`).
module = ["errant", "errant.*"]
ignore_missing_imports = true
